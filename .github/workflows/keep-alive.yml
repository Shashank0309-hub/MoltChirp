name: Keep Alive

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MoltChirp
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://moltchirp.onrender.com/api/health)
          echo "Health check response: $response"
          if [ "$response" != "200" ]; then
            echo "Health check failed with status $response"
            exit 1
          fi
          echo "MoltChirp is alive!"
          
      - name: Get health details
        run: |
          curl -s https://moltchirp.onrender.com/api/health | jq . || true
